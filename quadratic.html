<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quadratic Equation Calculator</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
<h1>📐 Quadratic Equation Calculator</h1>
<p>Find the Roots of ax² + bx + c = 0</p>
</header>

<div class="container">

<div class="card">

<h2>Quadratic Calculator</h2>

<input type="number" id="a" placeholder="Enter a">
<br><br>

<input type="number" id="b" placeholder="Enter b">
<br><br>

<input type="number" id="c" placeholder="Enter c">
<br><br>

<button onclick="calculate()">Calculate</button>

<h3 id="result"></h3>

</div>

</div>

<div style="text-align:center;margin:30px;">
<button onclick="window.location.href='math.html'">⬅ Back to Mathematics</button>
</div>

<script>
function calculate(){

let a=Number(document.getElementById("a").value);
let b=Number(document.getElementById("b").value);
let c=Number(document.getElementById("c").value);

if(a===0){
document.getElementById("result").innerHTML="a cannot be 0";
return;
}

let d=(b*b)-(4*a*c);

if(d>0){
let x1=(-b+Math.sqrt(d))/(2*a);
let x2=(-b-Math.sqrt(d))/(2*a);
document.getElementById("result").innerHTML=
"Root 1 = "+x1.toFixed(2)+"<br>Root 2 = "+x2.toFixed(2);
}
else if(d===0){
let x=(-b)/(2*a);
document.getElementById("result").innerHTML=
"Both Roots = "+x.toFixed(2);
}
else{
document.getElementById("result").innerHTML=
"No Real Roots";
}

}
</script>

</body>
</html>
